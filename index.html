<!doctype html>
<html lang="es" data-theme="dark" style="background:#000">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>ATKL Records</title>
    <meta name="description" content="ATKL Records: label and collective of Techno and Hard Techno, Chilean based." />

    <!-- Vista previa al compartir (WhatsApp, Instagram, X…). Cambia og:url cuando tengas dominio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATKL Records" />
    <meta property="og:title" content="ATKL Records" />
    <meta property="og:description" content="Label and collective of Techno and Hard Techno, Chilean based." />
    <meta property="og:url" content="https://sinisterhd.github.io/ATKL-LINKS/" />
    <meta property="og:image" content="https://sinisterhd.github.io/ATKL-LINKS/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preload" href="%BASE_URL%logo-atkl.webp" as="image" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Tema antes de pintar: oscuro por defecto; claro solo si se eligió con el botón.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('atkl_theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif;color:#eee;background:#080808">
        Activa JavaScript para ver todos los accesos, o entra a
        <a style="color:#ff6a76" href="https://www.instagram.com/atkl.records/">Instagram oficial de ATKL</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
